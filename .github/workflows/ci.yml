name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check the README rules convention
        run: bin/check-readme-rules

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - uses: ruby/setup-ruby@v1.336.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      # rustup comes with the runner: no third-party action to install Rust.
      # The version and components come from rust-toolchain.toml (Dependabot updates it).
      - name: Setup Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Build native extension
        run: bundle exec rake compile

      - name: Cargo test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Upload native extension
        uses: actions/upload-artifact@v7.0.2
        with:
          name: shirobai-so
          path: lib/shirobai/shirobai.so
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - uses: ruby/setup-ruby@v1.336.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Download native extension
        uses: actions/download-artifact@v8.0.2
        with:
          name: shirobai-so
          path: lib/shirobai/

      - name: RSpec
        run: bundle exec rspec

  # The plugin gem has its own bundle on purpose: rubocop-performance in the
  # root bundle would leak into the core suite's default config through
  # rubocop/rspec/support (CopHelper scans Gem.loaded_specs).
  test-shirobai-performance:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - uses: ruby/setup-ruby@v1.336.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Download native extension
        uses: actions/download-artifact@v8.0.2
        with:
          name: shirobai-so
          path: lib/shirobai/

      - name: Install the plugin bundle
        working-directory: gems/shirobai-performance
        run: bundle install --jobs 4

      - name: RSpec (shirobai-performance)
        working-directory: gems/shirobai-performance
        run: bundle exec rspec

  # Same separate-bundle reasoning as the performance job: rubocop-rspec in
  # the root bundle would leak into the core suite's default config.
  test-shirobai-rspec:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - uses: ruby/setup-ruby@v1.336.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Download native extension
        uses: actions/download-artifact@v8.0.2
        with:
          name: shirobai-so
          path: lib/shirobai/

      - name: Install the plugin bundle
        working-directory: gems/shirobai-rspec
        run: bundle install --jobs 4

      - name: RSpec (shirobai-rspec)
        working-directory: gems/shirobai-rspec
        run: bundle exec rspec

  # Same separate-bundle reasoning as the performance job: rubocop-rails in
  # the root bundle would leak into the core suite's default config.
  test-shirobai-rails:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - uses: ruby/setup-ruby@v1.336.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Download native extension
        uses: actions/download-artifact@v8.0.2
        with:
          name: shirobai-so
          path: lib/shirobai/

      - name: Install the plugin bundle
        working-directory: gems/shirobai-rails
        run: bundle install --jobs 4

      - name: RSpec (shirobai-rails)
        working-directory: gems/shirobai-rails
        run: bundle exec rspec

  # Parity oracle: corpus x mode matrix.
  # Stock jobs skip the Rust build entirely; shirobai jobs download the
  # pre-built .so. A merge job diffs each corpus's stock vs shirobai JSON.
  parity-run:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        corpus:
          - name: mastodon
            repo: mastodon/mastodon
            ref: b873d2e9eb0bc212e7f166df570f95d8844e93db
          - name: discourse
            repo: discourse/discourse
            ref: a1734d7f8efffd9877d04772184ca5f1478b106e
          - name: redmine
            repo: redmine/redmine
            ref: 74dc20d73692b3e96a133bbd11c395c323f18c44
          - name: fluentd
            repo: fluent/fluentd
            ref: 3b34a7b9a066a347d19e976b238be1ce9ea877fa
          # fluentd with every inspected file rewritten to CRLF. The other
          # corpora are all LF, so they cannot see offsets that drift by the
          # "\r" that raw_source keeps and buffer.source drops. fluentd is the
          # smallest corpus, so this job ends well before discourse.
          - name: fluentd_crlf
            repo: fluent/fluentd
            ref: 3b34a7b9a066a347d19e976b238be1ce9ea877fa
            crlf: true
          # The Ruby standard library (ruby/ruby v4.0.5, lib/ only). Its style
          # is far from the Rails apps above (modifier rescue, heredocs, `;`,
          # plain begin..end), and it found differences none of them had.
          # About 45 s per mode, so it ends well before discourse.
          - name: stdlib
            repo: ruby/ruby
            ref: 64336ffd0ee9e1f4c05891695a3d7b49cb709721
            sparse: /lib/
          - name: rubocop_source
            repo: ""
            ref: ""
        mode: [stock, shirobai]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - uses: ruby/setup-ruby@v1.336.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Download native extension
        if: matrix.mode == 'shirobai'
        uses: actions/download-artifact@v8.0.2
        with:
          name: shirobai-so
          path: lib/shirobai/

      - name: Checkout corpus
        if: matrix.corpus.repo != '' && !matrix.corpus.sparse
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ matrix.corpus.repo }}
          ref: ${{ matrix.corpus.ref }}
          path: .tmp/${{ matrix.corpus.crlf && format('{0}_src', matrix.corpus.name) || matrix.corpus.name }}

      - name: Checkout corpus (sparse)
        if: matrix.corpus.sparse
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ matrix.corpus.repo }}
          ref: ${{ matrix.corpus.ref }}
          path: .tmp/${{ matrix.corpus.name }}
          sparse-checkout: ${{ matrix.corpus.sparse }}
          sparse-checkout-cone-mode: false

      - name: Create rubocop_source symlink
        if: matrix.corpus.name == 'rubocop_source'
        run: ln -s ../vendor/rubocop .tmp/rubocop_source

      - name: Install Gemfile (stock)
        if: matrix.mode == 'stock'
        run: BUNDLE_GEMFILE=Gemfile.stock bundle install

      - name: Make the CRLF copy
        if: matrix.corpus.crlf
        env:
          BUNDLE_GEMFILE: ${{ matrix.mode == 'stock' && 'Gemfile.stock' || 'Gemfile.with_shirobai' }}
        run: benches/crlf_corpus.sh ".tmp/${{ matrix.corpus.name }}_src" ".tmp/${{ matrix.corpus.name }}"

      - name: Run rubocop (stock)
        if: matrix.mode == 'stock'
        run: |
          BUNDLE_GEMFILE=Gemfile.stock bundle exec rubocop \
            --force-default-config --cache false --no-server -f json \
            ".tmp/${{ matrix.corpus.name }}" \
            > offense.json 2>/dev/null || true

      - name: Run rubocop (shirobai)
        if: matrix.mode == 'shirobai'
        run: |
          BUNDLE_GEMFILE=Gemfile.with_shirobai bundle exec rubocop \
            --require shirobai --force-default-config --cache false --no-server -f json \
            ".tmp/${{ matrix.corpus.name }}" \
            > offense.json 2>/dev/null || true

      - name: Upload offense JSON
        uses: actions/upload-artifact@v7.0.2
        with:
          name: parity-${{ matrix.corpus.name }}-${{ matrix.mode }}
          path: offense.json
          retention-days: 1

  parity-check:
    needs: parity-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ruby/setup-ruby@v1.336.0
        with:
          ruby-version: "4.0"

      - name: Download all parity artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts/
          pattern: parity-*

      - name: Compare all corpora
        run: |
          failed=0
          for corpus in mastodon discourse redmine fluentd fluentd_crlf stdlib rubocop_source; do
            echo "=== $corpus ==="
            stock="artifacts/parity-${corpus}-stock/offense.json"
            shirobai="artifacts/parity-${corpus}-shirobai/offense.json"
            if [[ ! -f "$stock" || ! -f "$shirobai" ]]; then
              echo "SKIP: missing artifact for $corpus"
              continue
            fi
            if ! benches/parity_compare.sh "$stock" "$shirobai"; then
              failed=1
            fi
            echo
          done
          exit $failed
