# Dependabot here is a tripwire for upstream releases, not an auto-updater.
# shirobai pins RuboCop and each plugin exactly,
# so a new upstream release blocks users until shirobai follows it.
# Treat each bump PR as the follow-up task: check parity on a branch
# and update the other pins before merging:
# Gemfile.stock*, Gemfile.with_shirobai*, benches/Gemfile.*,
# the vendor/ submodules, and the versions written in the READMEs.
#
# One bundler entry per gemspec, each allowing only the gem that gemspec pins.
# The root entry also watches prism (see the comment there).
# The plugin directories also see rubocop through the path gem,
# and allowing it there would open duplicate PRs against shirobai.gemspec.
version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: daily
    allow:
      - dependency-name: "rubocop"
      # The Rust side must parse with the same prism as stock RuboCop.
      # Stock gets prism through rubocop-ast (`prism ~> 1.7` as of 1.50.0).
      # These two tell us when that changes:
      # a new prism 1.x to follow in the crates,
      # or a rubocop-ast that allows prism 2.
      - dependency-name: "rubocop-ast"
        dependency-type: indirect
      - dependency-name: "prism"
        dependency-type: indirect

  # The prism crates, kept on the same version as the prism gem
  # that stock resolves (see the bundler entry above).
  # Major 2 is ignored until rubocop-ast allows prism 2:
  # moving only the crate would make shirobai parse differently from stock.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: daily
    allow:
      - dependency-name: "ruby-prism"
      - dependency-name: "ruby-prism-sys"
    ignore:
      - dependency-name: "ruby-prism*"
        update-types: ["version-update:semver-major"]
    groups:
      prism:
        patterns:
          - "ruby-prism*"

  - package-ecosystem: bundler
    directory: "/gems/shirobai-performance"
    schedule:
      interval: daily
    allow:
      - dependency-name: "rubocop-performance"

  - package-ecosystem: bundler
    directory: "/gems/shirobai-rails"
    schedule:
      interval: daily
    allow:
      - dependency-name: "rubocop-rails"

  - package-ecosystem: bundler
    directory: "/gems/shirobai-rspec"
    schedule:
      interval: daily
    allow:
      - dependency-name: "rubocop-rspec"
