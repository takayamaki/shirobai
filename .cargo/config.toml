# Cross-compiling to arm64-darwin and aarch64-linux (rb-sys-dock via the
# cross-gem action): ruby-prism-sys generates its bindings with bindgen, and
# bindgen needs the target's C headers as the clang sysroot. The rbsys images
# set BINDGEN_EXTRA_CLANG_ARGS_<target> in underscore form
# (aarch64_apple_darwin / aarch64_unknown_linux_gnu), but bindgen reads the
# dash-separated variant first and stops there, so the sysroot never reaches
# clang and it parses the host glibc headers for the cross target and dies
# with "'sys/cdefs.h' file not found". This hit arm64-darwin in release run
# 29198424294 and aarch64-linux in release run 40313616745.
# Setting the dash variant here with force = true wins over whatever the
# container environment carries, and is inert on every other target (bindgen
# only reads the variant that matches TARGET).
# The paths are the ones baked into rake-compiler-dock 1.12.0 and referenced
# by rb-sys 0.9.128's Dockerfiles; revisit when the rcd base image changes.
[env]
"BINDGEN_EXTRA_CLANG_ARGS_aarch64-apple-darwin" = { value = "--sysroot=/opt/osxcross/target/SDK/MacOSX11.1.sdk/", force = true }
"BINDGEN_EXTRA_CLANG_ARGS_aarch64-unknown-linux-gnu" = { value = "--sysroot=/usr/aarch64-linux-gnu", force = true }
